<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>旺旺軍團動畫指揮室 v1.1</title>
  <style>
    :root {
      --bg: #0a0d16;
      --room: #11182a;
      --panel: rgba(18, 24, 40, 0.88);
      --panel-soft: rgba(24, 31, 50, 0.86);
      --line: rgba(255,255,255,.08);
      --text: #edf2ff;
      --muted: #97a0ba;
      --cyan: #67d7ff;
      --blue: #70a8ff;
      --green: #63f2a6;
      --yellow: #ffd35e;
      --red: #ff7b7b;
      --shadow: 0 20px 40px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(103,215,255,.14), transparent 28%),
        radial-gradient(circle at 80% 0%, rgba(255,140,214,.11), transparent 26%),
        linear-gradient(180deg, #111527 0%, #090b12 100%);
      min-height: 100vh;
    }
    .wrap { max-width: 1500px; margin: 0 auto; padding: 16px; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      margin-bottom: 16px; padding: 16px 18px;
      border: 1px solid var(--line); border-radius: 22px;
      background: rgba(11,16,28,.72); backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
    }
    .eyebrow { color: var(--cyan); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
    .title { font-size: 30px; font-weight: 900; margin-top: 4px; }
    .subtitle { color: var(--muted); margin-top: 6px; font-size: 14px; }
    .meta { text-align: right; color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, .75fr); gap: 16px; }
    .panel {
      border: 1px solid var(--line); border-radius: 24px; background: var(--panel);
      box-shadow: var(--shadow); overflow: hidden;
    }
    .panel-head { display:flex; justify-content:space-between; align-items:center; padding: 18px 18px 0; gap: 12px; }
    .panel h2 { margin: 0; font-size: 18px; }
    .hint { color: var(--muted); font-size: 12px; }
    .room {
      position: relative; min-height: 780px; padding: 18px;
      background:
        radial-gradient(circle at 50% 15%, rgba(112,168,255,.08), transparent 25%),
        linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0) 30%),
        linear-gradient(180deg, #151c31 0%, #0d1323 64%, #111826 64%, #0d121d 100%);
    }
    .room::before {
      content: ""; position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: .35; pointer-events: none;
    }
    .world { position: relative; z-index: 1; min-height: 740px; border-radius: 20px; padding: 12px; }
    .hud {
      position: absolute; top: 14px; left: 14px; display:flex; gap:10px; flex-wrap:wrap; z-index: 3;
    }
    .mini-stat {
      padding: 10px 12px; border-radius: 16px; background: rgba(9,13,24,.72); border: 1px solid var(--line);
      min-width: 100px;
    }
    .mini-stat b { display:block; font-size: 20px; }
    .mini-stat span { color: var(--muted); font-size: 12px; }
    .screen-wall {
      position: absolute; top: 82px; left: 50%; transform: translateX(-50%);
      width: min(92%, 920px); height: 128px; display:grid; grid-template-columns: repeat(4,1fr); gap: 12px;
    }
    .screen {
      border-radius: 18px; border:1px solid rgba(103,215,255,.15); background:
      linear-gradient(180deg, rgba(103,215,255,.14), rgba(17,24,42,.68));
      position: relative; overflow: hidden; box-shadow: inset 0 0 22px rgba(103,215,255,.06);
    }
    .screen::after {
      content:""; position:absolute; inset:0; background: linear-gradient(120deg, transparent 20%, rgba(255,255,255,.08) 35%, transparent 50%);
      animation: scan 7s linear infinite;
    }
    .screen .bar { position:absolute; left:12px; right:12px; height:6px; border-radius:999px; background:rgba(255,255,255,.08); }
    .screen .bar.b1 { top: 24px; width: 64%; background: rgba(103,215,255,.55); }
    .screen .bar.b2 { top: 42px; width: 44%; }
    .screen .bar.b3 { top: 60px; width: 76%; background: rgba(112,168,255,.25); }
    .screen .pulse-dot {
      position:absolute; right:14px; top:14px; width:10px; height:10px; border-radius:50%; background: var(--green);
      box-shadow: 0 0 14px var(--green); animation: pulse 1.8s infinite;
    }
    .central-desk {
      position:absolute; left:50%; top:280px; transform:translateX(-50%);
      width:min(70%, 580px); height:210px; border-radius: 28px 28px 80px 80px;
      background: linear-gradient(180deg, #25314f 0%, #19223a 55%, #101726 100%);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 24px 40px rgba(0,0,0,.32);
    }
    .central-desk::before {
      content:""; position:absolute; inset: 18px 24px 90px; border-radius: 18px;
      background: linear-gradient(180deg, rgba(103,215,255,.18), rgba(103,215,255,.04));
      border:1px solid rgba(103,215,255,.18);
    }
    .table-glow {
      position:absolute; left:50%; top:246px; transform:translateX(-50%);
      width: 500px; height: 80px; border-radius:50%; background: rgba(103,215,255,.08); filter: blur(18px);
    }
    .agent {
      position:absolute; width: 136px; min-height: 178px; display:flex; flex-direction:column; align-items:center; gap: 8px;
      text-align:center;
    }
    .agent.main { width: 198px; min-height: 230px; z-index: 2; }
    .avatar-wrap { position: relative; width: 88px; height: 88px; }
    .main .avatar-wrap { width: 118px; height: 118px; }
    .chair {
      position:absolute; left:50%; bottom:-10px; transform:translateX(-50%);
      width: 74px; height: 38px; border-radius: 20px 20px 12px 12px; background: rgba(123,145,187,.16);
      border:1px solid rgba(255,255,255,.08);
    }
    .avatar {
      position:absolute; inset:0; border-radius: 28px; display:flex; align-items:center; justify-content:center;
      font-size: 38px; background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.1); box-shadow: 0 10px 18px rgba(0,0,0,.26);
      animation: floaty 3.8s ease-in-out infinite;
    }
    .main .avatar { font-size: 52px; }
    .main .avatar::after {
      content:"總控"; position:absolute; top:-10px; right:-12px; font-size:11px; font-weight:800;
      padding: 6px 8px; border-radius:999px; background: rgba(103,215,255,.18); color: #d9f7ff; border:1px solid rgba(103,215,255,.2);
    }
    .status-orb {
      position:absolute; width: 18px; height:18px; border-radius:50%; right:-8px; bottom:4px;
      border:2px solid rgba(8,10,18,.8); box-shadow: 0 0 18px currentColor;
    }
    .agent-name { font-size: 17px; font-weight: 900; }
    .main .agent-name { font-size: 24px; }
    .agent-role { color: var(--muted); font-size: 11px; line-height: 1.35; max-width: 138px; }
    .bubble {
      width: 100%; padding: 9px 10px; border-radius: 16px; background: rgba(9,13,24,.66); border:1px solid var(--line);
      font-size: 11px; line-height: 1.35; box-shadow: 0 10px 20px rgba(0,0,0,.18);
    }
    .state-tag {
      display:inline-flex; align-items:center; gap:6px; margin-top:2px; padding:5px 10px; border-radius: 999px; font-size: 10px; font-weight: 800;
      background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08);
    }
    .agent.busy .avatar, .agent.working .avatar { animation-duration: 2.2s; }
    .agent.busy .avatar::before, .agent.working .avatar::before {
      content:""; position:absolute; inset:-8px; border-radius: 34px; border:1px solid rgba(103,215,255,.14); animation: ring 1.8s infinite;
    }
    .agent.warn .avatar { animation: nervous 1.1s ease-in-out infinite; }
    .typing { display:inline-flex; gap: 4px; align-items:center; justify-content:center; margin-top: 6px; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .3; animation: typing 1.1s infinite; }
    .typing i:nth-child(2) { animation-delay: .18s; }
    .typing i:nth-child(3) { animation-delay: .36s; }
    .right-panel { padding: 16px; display:grid; gap: 14px; }
    .card { padding: 14px; border-radius: 18px; background: var(--panel-soft); border: 1px solid var(--line); }
    .card h3 { margin: 0 0 10px; font-size: 15px; }
    .task-list, .alert-list { display:grid; gap:10px; }
    .task-item, .alert-item { padding: 12px; border-radius: 14px; background: rgba(8,12,22,.52); border:1px solid rgba(255,255,255,.06); }
    .task-top, .alert-top { display:flex; justify-content:space-between; gap:10px; font-size:12px; color: var(--muted); margin-bottom: 6px; }
    .task-main, .alert-main { font-size: 13px; line-height: 1.45; }
    .legend { display:flex; flex-wrap:wrap; gap: 8px; }
    .legend span { padding: 6px 10px; border-radius: 999px; font-size: 11px; border:1px solid var(--line); background: rgba(255,255,255,.04); }
    .busy .status-orb { color: var(--blue); background: var(--blue); }
    .working .status-orb { color: var(--green); background: var(--green); }
    .warn .status-orb { color: var(--yellow); background: var(--yellow); }
    .idle .status-orb { color: #98a0b6; background: #98a0b6; }
    .offline .status-orb { color: var(--red); background: var(--red); }
    .tiny { font-size: 11px; color: var(--muted); }

    @keyframes floaty { 0%,100% { transform: translateY(0px);} 50% { transform: translateY(-8px);} }
    @keyframes nervous { 0%,100% { transform: translate(0,0);} 25% { transform: translate(-2px,0);} 75% { transform: translate(2px,0);} }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity:1;} 50% { transform: scale(1.2); opacity:.6;} }
    @keyframes typing { 0%,80%,100% { transform: translateY(0); opacity:.3;} 40% { transform: translateY(-5px); opacity:1;} }
    @keyframes ring { 0% { opacity:.6; transform:scale(.98);} 100% { opacity:0; transform:scale(1.15);} }
    @keyframes scan { from { transform: translateX(-120%);} to { transform: translateX(140%);} }

    @media (max-width: 1180px) {
      .grid { grid-template-columns: 1fr; }
      .room { min-height: 840px; }
    }

    @media (max-width: 820px) {
      .wrap { padding: 12px; }
      .topbar { flex-direction: column; align-items:flex-start; }
      .meta { text-align:left; }
      .title { font-size: 24px; }
      .subtitle { font-size: 13px; }
      .panel-head { flex-direction: column; align-items:flex-start; }
      .room { min-height: auto; padding: 14px; }
      .world { min-height: auto; padding: 0; display: flex; flex-direction: column; gap: 14px; }
      .hud, .screen-wall, .central-desk, .table-glow { position: relative; left: auto; top: auto; transform: none; width: 100%; }
      .hud { inset: auto; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
      .mini-stat { min-width: 0; }
      .screen-wall { grid-template-columns: repeat(2, minmax(0,1fr)); height: auto; }
      .screen { min-height: 92px; }
      .central-desk { height: 96px; border-radius: 20px; }
      .central-desk::before { inset: 12px 16px 24px; }
      .table-glow { height: 40px; width: 70%; margin: -10px auto 0; }
      #agents-layer {
        position: relative; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; padding-bottom: 4px;
      }
      .agent {
        position: relative !important; left: auto !important; top: auto !important; transform: none !important;
        width: 100%; min-height: auto; padding: 10px; border-radius: 18px; background: rgba(8,12,22,.42); border: 1px solid rgba(255,255,255,.06);
      }
      .agent.main {
        grid-column: 1 / -1; order: -1; width: 100%;
      }
      .avatar-wrap { width: 74px; height: 74px; }
      .main .avatar-wrap { width: 96px; height: 96px; }
      .avatar { font-size: 30px; }
      .main .avatar { font-size: 44px; }
      .chair { display:none; }
      .agent-role { max-width: none; }
      .bubble { font-size: 10px; padding: 8px 9px; }
      .state-tag { font-size: 9px; }
      .task-top, .alert-top, .task-main, .alert-main { font-size: 12px; }
    }

    @media (max-width: 480px) {
      #agents-layer { grid-template-columns: 1fr; }
      .hud { grid-template-columns: 1fr 1fr; }
      .screen-wall { grid-template-columns: 1fr 1fr; gap: 8px; }
      .topbar { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="eyebrow">Wanwang Army · Animated Command Center</div>
        <div class="title">旺旺軍團動畫指揮室 🐈‍⬛</div>
        <div class="subtitle">手機也能看，不再全部擠成一團。</div>
      </div>
      <div class="meta">
        <div id="meta-updated">更新中…</div>
        <div id="meta-status">載入中…</div>
      </div>
    </div>

    <div class="grid">
      <section class="panel">
        <div class="panel-head">
          <h2>總控室</h2>
          <div class="hint">桌機像場景，手機自動切成角色卡片區</div>
        </div>
        <div class="room">
          <div class="world">
            <div class="hud" id="hud"></div>
            <div class="screen-wall" aria-hidden="true">
              <div class="screen"><span class="pulse-dot"></span><span class="bar b1"></span><span class="bar b2"></span><span class="bar b3"></span></div>
              <div class="screen"><span class="pulse-dot"></span><span class="bar b1"></span><span class="bar b2"></span><span class="bar b3"></span></div>
              <div class="screen"><span class="pulse-dot"></span><span class="bar b1"></span><span class="bar b2"></span><span class="bar b3"></span></div>
              <div class="screen"><span class="pulse-dot"></span><span class="bar b1"></span><span class="bar b2"></span><span class="bar b3"></span></div>
            </div>
            <div class="table-glow" aria-hidden="true"></div>
            <div class="central-desk" aria-hidden="true"></div>
            <div id="agents-layer"></div>
          </div>
        </div>
      </section>

      <aside class="panel">
        <div class="panel-head">
          <h2>任務 / 警報面板</h2>
          <div class="hint">維持 operational value</div>
        </div>
        <div class="right-panel">
          <div class="card">
            <h3>狀態圖例</h3>
            <div class="legend">
              <span>🔵 busy</span>
              <span>🟢 working</span>
              <span>🟡 warn</span>
              <span>⚪ idle</span>
            </div>
          </div>
          <div class="card">
            <h3>調動紀錄</h3>
            <div id="dispatch-list" class="task-list"></div>
          </div>
          <div class="card">
            <h3>警報異常</h3>
            <div id="alerts-list" class="alert-list"></div>
          </div>
          <div class="card">
            <h3>看板備註</h3>
            <div class="tiny" id="meta-note">看板目前仍以假資料 / 映射資料為主，之後再接 live session。</div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const stateLabel = { busy: '總控爆忙', working: '正在上工', warn: '黃燈觀察', idle: '待命發呆', offline: '離線' };
    const stateClass = { busy: 'busy', working: 'working', warn: 'warn', idle: 'idle', offline: 'offline' };
    const positions = {
      main: { left: '50%', top: '330px', transform: 'translateX(-50%)' },
      elite: { left: '6%', top: '220px' },
      infinity: { left: '78%', top: '220px' },
      stone: { left: '6%', top: '525px' },
      shipping: { left: '78%', top: '525px' },
      faby: { left: '26%', top: '560px' },
      ecommerce: { left: '58%', top: '575px' },
      bianca: { left: '24%', top: '210px' },
      luiza: { left: '60%', top: '210px' }
    };
    function hudStats(data) {
      const busy = data.agents.filter(a => ['busy','working'].includes(a.state)).length;
      const warns = data.agents.filter(a => a.state === 'warn').length;
      return [
        { value: data.agents.length, label: '成員數' },
        { value: busy, label: '忙碌中' },
        { value: warns, label: '警報' },
        { value: data.dispatches.length, label: '調動' }
      ];
    }
    function renderHud(data) {
      document.getElementById('hud').innerHTML = hudStats(data).map(item => `<div class="mini-stat"><b>${item.value}</b><span>${item.label}</span></div>`).join('');
    }
    function typingMarkup(state) {
      return ['busy','working','warn'].includes(state) ? '<span class="typing" aria-hidden="true"><i></i><i></i><i></i></span>' : '';
    }
    function agentMarkup(agent) {
      const cls = stateClass[agent.state] || 'idle';
      const pos = positions[agent.id] || { left: '50%', top: '50%' };
      const main = agent.id === 'main' ? 'main' : '';
      const style = Object.entries(pos).map(([k,v]) => `${k}:${v}`).join(';');
      return `
        <div class="agent ${cls} ${main}" style="${style}">
          <div class="avatar-wrap">
            <div class="chair"></div>
            <div class="avatar">${agent.avatar || '🤖'}</div>
            <span class="status-orb"></span>
          </div>
          <div class="agent-name">${agent.name}</div>
          <div class="agent-role">${agent.role}</div>
          <div class="state-tag">${stateLabel[agent.state] || '待命'}</div>
          <div class="bubble">
            <div>${agent.task}</div>
            ${typingMarkup(agent.state)}
            <div class="tiny" style="margin-top:8px;">最後活動：${agent.lastActivity}</div>
          </div>
        </div>`;
    }
    function dispatchMarkup(item) {
      return `<div class="task-item"><div class="task-top"><span>${item.time}</span><span>${item.status}</span></div><div class="task-main"><b>${item.from}</b> → <b>${item.to}</b><br>${item.task}</div></div>`;
    }
    function alertMarkup(item) {
      return `<div class="alert-item"><div class="alert-top"><span>${item.type}</span><span>${item.status}</span></div><div class="alert-main"><b>${item.target}</b><br>${item.detail}</div></div>`;
    }
    fetch('./data/army.json')
      .then(r => r.json())
      .then(data => {
        document.title = data.meta.title;
        document.getElementById('meta-updated').textContent = `最後更新：${data.meta.updatedAt}`;
        document.getElementById('meta-status').textContent = `狀態：${data.meta.status}`;
        document.getElementById('meta-note').textContent = data.meta.note || '目前仍以展示資料為主，後續再接 live session。';
        renderHud(data);
        document.getElementById('agents-layer').innerHTML = data.agents.map(agentMarkup).join('');
        document.getElementById('dispatch-list').innerHTML = data.dispatches.map(dispatchMarkup).join('');
        document.getElementById('alerts-list').innerHTML = data.alerts.map(alertMarkup).join('');
      })
      .catch(err => {
        document.getElementById('meta-status').textContent = '載入失敗';
        document.getElementById('meta-note').textContent = 'JSON 載入失敗，請檢查 data/army.json';
        console.error(err);
      });
  </script>
</body>
</html>
